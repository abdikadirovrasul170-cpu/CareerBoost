<!DOCTYPE html>
<html lang="kk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${projectName}">CareerBoost</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f3f6fc; color: #172554; }
        header { padding: 22px 8%; background: #fff; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 12px #10204012; }
        .logo { font-size: 24px; font-weight: 700; color: #2563eb; }
        main { max-width: 900px; margin: 100px auto; padding: 48px 24px; text-align: center; }
        h1 { font-size: clamp(36px, 6vw, 58px); margin-bottom: 18px; }
        p { font-size: 20px; color: #64748b; }
        .tag { display: inline-block; margin-top: 24px; padding: 12px 20px; border-radius: 10px; background: #2563eb; color: white; }
    </style>
</head>
<body>
<header><div class="logo">CareerBoost</div><span>Мансап жолың осы жерден басталады</span></header>
<main>
    <h1 th:text="${projectName}">CareerBoost</h1>
    <p th:text="${description}">Өз болашағыңды CareerBoost арқылы құр!</p>
    <span class="tag">Жоба әзірлену үстінде</span>
</main>
</body>
</html>
